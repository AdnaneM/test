[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "edgebet"
version = "0.1.0"
description = "Moteur de recommandations de paris sportifs : modèles de prédiction, détection de value bets, grille quotidienne et notifications."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "scipy>=1.12",
  "scikit-learn>=1.5",
  "httpx>=0.27",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "fastapi>=0.111",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "typer>=0.12",
  "rich>=13.7",
  "pyyaml>=6.0",
  "joblib>=1.4",
  "python-dateutil>=2.9",
  "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "pytest-cov>=5.0", "ruff>=0.5", "httpx>=0.27"]
lightgbm = ["lightgbm>=4.3"]

[project.scripts]
edgebet = "edgebet.cli:app"

[tool.setuptools.packages.find]
include = ["edgebet*"]

[tool.setuptools.package-data]
edgebet = ["sports/football/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP"]
ignore = ["E501", "B008"]
